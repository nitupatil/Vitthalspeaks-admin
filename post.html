\<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <title>Enquiries - Vitthal Speaks Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --bg: #f0f2f5; --card: #ffffff; --text: #1e293b; --muted: #64748b; --primary: #0f172a; --accent: #ff9800; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; padding-bottom: 70px; overflow-x: hidden; }
    a { text-decoration: none; color: inherit; }
    
    .app-header { background: var(--primary); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .app-header h1 { margin: 0; font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .live-dot { width: 10px; height: 10px; background: var(--success); border-radius: 50%; display: inline-block; box-shadow: 0 0 8px var(--success); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
    
    .container { max-width: 1000px; margin: 0 auto; padding: 15px; width: 100%; }
    .header-action { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h2 { font-size: 1.3rem; margin: 0; color: var(--primary); }

    .btn-action { background: #f1f5f9; border: 1px solid var(--border); color: var(--primary); padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; font-size: 0.9rem; }

    .enquiry-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
    .enquiry-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; position: relative; width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
    .enquiry-header { border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; margin-bottom: 12px; padding-right: 40px; }
    .enquiry-name { font-weight: 700; font-size: 1.05rem; color: var(--primary); margin-bottom: 4px; }
    .enquiry-email { font-size: 0.85rem; color: var(--muted); word-break: break-all; }
    .enquiry-date { font-size: 0.75rem; color: var(--muted); font-weight: 600; margin-top: 5px; }
    .enquiry-msg { font-size: 0.95rem; color: #333; line-height: 1.6; white-space: pre-wrap; background: #f8fafc; padding: 12px; border-radius: 8px; border-left: 4px solid var(--accent); }
    
    .delete-btn { position: absolute; top: 15px; right: 15px; background: #fee2e2; color: var(--danger); border: none; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .delete-btn:hover { background: var(--danger); color: white; }

    .mobile-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #ffffff; border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0; z-index: 100; box-shadow: 0 -4px 10px rgba(0,0,0,0.05); }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--muted); background: none; border: none; font-size: 0.7rem; font-weight: 600; cursor: pointer; padding: 5px; }
    .nav-item i { font-size: 1.1rem; margin-bottom: 4px; }
    .nav-item.active { color: var(--accent); }
    .desktop-tabs { display: none; }
    
    @media (min-width: 768px) {
      .mobile-nav { display: none; }
      body { padding-bottom: 0; }
      .desktop-tabs { display: flex; gap: 10px; }
      .desktop-tabs .nav-item { flex-direction: row; font-size: 0.9rem; padding: 8px 16px; border-radius: 8px; background: rgba(255,255,255,0.1); color: white; }
      .desktop-tabs .nav-item.active { background: var(--accent); color: white; }
      .desktop-tabs .nav-item i { margin-bottom: 0; margin-right: 8px; font-size: 1rem; }
      .enquiry-card { padding: 20px; }
      .enquiry-header { display: flex; justify-content: space-between; align-items: flex-start; padding-right: 50px; }
      .enquiry-date { margin-top: 0; }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <h1><span class="live-dot"></span> Vitthal Speaks Admin</h1>
    <div class="desktop-tabs">
      <a href="index.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
      <a href="post.html" class="nav-item"><i class="fa-solid fa-newspaper"></i> Posts</a>
      <a href="ads.html" class="nav-item"><i class="fa-solid fa-bullhorn"></i> Ads</a>
      <a href="enquiry.html" class="nav-item active"><i class="fa-solid fa-envelope"></i> Enquiries</a>
    </div>
  </header>

  <div class="container">
    <div class="header-action">
      <h2>Website Enquiries</h2>
      <button class="btn-action" onclick="loadEnquiries()"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
    </div>
    
    <div id="enquiry-list" class="enquiry-grid">
      <div style="text-align: center; color: var(--muted); padding: 40px;">Loading messages...</div>
    </div>
  </div>

  <nav class="mobile-nav">
    <a href="index.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i>Home</a>
    <a href="post.html" class="nav-item"><i class="fa-solid fa-newspaper"></i>Posts</a>
    <a href="ads.html" class="nav-item"><i class="fa-solid fa-bullhorn"></i>Ads</a>
    <a href="enquiry.html" class="nav-item active"><i class="fa-solid fa-envelope"></i>Enquiries</a>
  </nav>

  <script>
    function formatDate(dateString) {
      const d = new Date(dateString);
      return d.toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' });
    }

    async function loadEnquiries() {
      const list = document.getElementById('enquiry-list');
      list.innerHTML = "<div style='text-align:center; padding: 20px;'><i class='fa-solid fa-spinner fa-spin'></i> Loading...</div>";
      
      const { data, error } = await db.from('contact_messages').select('*').order('created_at', { ascending: false });
      
      if(error) { list.innerHTML = `<div style="color:red; text-align:center;">Error: ${error.message}</div>`; return; }
      if(!data || data.length === 0) { list.innerHTML = `<div style="text-align:center; padding: 40px; background: white; border-radius: 12px;">No new messages.</div>`; return; }

      list.innerHTML = data.map(msg => `
        <div class="enquiry-card">
          <button class="delete-btn" onclick="deleteMessage(${msg.id})"><i class="fa-solid fa-trash"></i></button>
          <div class="enquiry-header">
            <div>
              <div class="enquiry-name"><i class="fa-solid fa-user-circle"></i> ${msg.name}</div>
              <div class="enquiry-email"><i class="fa-solid fa-envelope"></i> <a href="mailto:${msg.email}" style="color:#0284c7;">${msg.email}</a></div>
            </div>
            <div class="enquiry-date">${formatDate(msg.created_at)}</div>
          </div>
          <div class="enquiry-msg">${msg.message.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>
        </div>
      `).join('');
    }

    // REAL-TIME WEBSOCKET SUBSCRIPTION
    db.channel('admin-enquiries')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'contact_messages' }, payload => {
        console.log("New enquiry received in real-time!");
        loadEnquiries(); // Auto-refresh the list when a user submits a form
      }).subscribe();

    async function deleteMessage(id) {
      if(confirm("Are you sure you want to delete this message?")) {
        await db.from('contact_messages').delete().eq('id', id);
        loadEnquiries();
      }
    }

    loadEnquiries();
  </script>
</body>
</html>

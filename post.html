<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test 03 - Gemini Diagnostics</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f8; padding: 20px; color: #333; }
    .container { max-width: 650px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 5px solid #10b981; }
    h2 { margin-top: 0; color: #0f172a; display: flex; justify-content: space-between; align-items: center;}
    .badge { background: #10b981; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; }
    button { background: #2563eb; color: white; border: none; padding: 12px 15px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; font-size: 1rem; }
    button:hover { background: #1d4ed8; }
    pre { background: #1e293b; color: #e2e8f0; padding: 15px; border-radius: 5px; overflow-x: auto; white-space: pre-wrap; word-wrap: break-word; min-height: 200px; font-size: 0.9rem; line-height: 1.5;}
    .success { color: #4ade80; font-weight: bold; }
    .error { color: #f87171; font-weight: bold; }
    .info { color: #60a5fa; }
  </style>
</head>
<body>

  <div class="container">
    <h2>🧪 Gemini Deep Diagnostic <span class="badge">Test 03</span></h2>
    <p style="font-size: 0.85rem; color: #64748b;">This will ask Google servers to list every model your AIza key is allowed to use.</p>

    <button onclick="runDiagnosticTest()" id="testBtn">Scan Google Account Models</button>

    <h3 style="margin-top: 20px; font-size: 1rem;">Live Log:</h3>
    <pre id="output">Waiting to start...</pre>
  </div>

  <script>
    async function runDiagnosticTest() {
      const outputBox = document.getElementById('output');
      const btn = document.getElementById('testBtn');

      btn.innerText = "Scanning Google Servers...";
      btn.disabled = true;
      outputBox.innerHTML = "<span class='info'>Step 1: Fetching GEMINI_API_KEY from database...</span>\n";

      let apiKey = null;

      try {
        if (typeof db === 'undefined') throw new Error("Supabase 'db' is not defined.");
        const { data, error } = await db.rpc('get_secret_key', { secret_name: 'GEMINI_API_KEY' });
        if (error) throw new Error(error.message);
        if (!data) throw new Error("Key not found in database.");
        apiKey = data;
        outputBox.innerHTML += `<span class='success'>✓ Key found: ${apiKey.substring(0, 8)}...</span>\n\n`;
      } catch (err) {
        outputBox.innerHTML += `<span class='error'>❌ DB ERROR: ${err.message}</span>`;
        btn.innerText = "Scan Google Account Models";
        btn.disabled = false;
        return;
      }

      outputBox.innerHTML += "<span class='info'>Step 2: Asking Google for allowed models...</span>\n";
      
      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`;
        const response = await fetch(url);

        if (!response.ok) {
          const errText = await response.text();
          throw new Error(`Google API Error ${response.status}: ${errText}`);
        }

        const data = await response.json();
        
        if (!data.models || data.models.length === 0) {
            outputBox.innerHTML += `<span class='error'>❌ Google returned an empty list. The Generative Language API is NOT enabled for this key.</span>`;
            return;
        }

        // Filter only models that support text generation (generateContent)
        const textModels = data.models.filter(m => m.supportedGenerationMethods.includes("generateContent"));
        
        const modelListText = textModels.map(m => ` - ${m.name.replace('models/', '')}`).join('\n');
        
        outputBox.innerHTML += `\n<span class='success'>✓ SUCCESS! YOUR ALLOWED TEXT MODELS ARE:</span>\n${modelListText}\n\n<span class='info'>-> Copy the name of the 'flash' or 'pro' model from this list and reply with it!</span>`;

      } catch (error) {
        outputBox.innerHTML += `<span class='error'>❌ SCAN FAILED:\n${error.message}</span>`;
      } finally {
        btn.innerText = "Scan Google Account Models";
        btn.disabled = false;
      }
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database to Groq Tester</title>
  <!-- Load Supabase and your config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f8; padding: 20px; color: #333; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; color: #0f172a; }
    .input-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
    textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-family: monospace; box-sizing: border-box; }
    button { background: #9333ea; color: white; border: none; padding: 12px 15px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; font-size: 1rem; }
    button:hover { background: #7e22ce; }
    pre { background: #1e293b; color: #4ade80; padding: 15px; border-radius: 5px; overflow-x: auto; white-space: pre-wrap; word-wrap: break-word; min-height: 100px;}
  </style>
</head>
<body>

  <div class="container">
    <h2>🧪 Test Groq (Via Database)</h2>
    <p style="font-size: 0.85rem; color: #64748b;">This will pull the key from Supabase and test the Groq connection.</p>
    
    <div class="input-group">
      <label>Test Prompt:</label>
      <textarea id="prompt" rows="3">Write exactly one sentence in Marathi saying "Hello, the AI is working."</textarea>
    </div>

    <button onclick="testGroqFromDB()" id="testBtn">Test Connection</button>

    <h3 style="margin-top: 20px; font-size: 1rem;">Live Log:</h3>
    <pre id="output">Waiting to start...</pre>
  </div>

  <script>
    async function testGroqFromDB() {
      const prompt = document.getElementById('prompt').value.trim();
      const outputBox = document.getElementById('output');
      const btn = document.getElementById('testBtn');

      btn.innerText = "Working...";
      btn.disabled = true;
      outputBox.style.color = "#fbbf24";

      try {
        // STEP 1: Get Key from Database
        outputBox.innerText = "Step 1: Fetching GROQ_API_KEY from Supabase...\n";
        
        if (typeof db === 'undefined') {
            throw new Error("Supabase 'db' is not defined. Check if config.js is loading correctly.");
        }

        const { data: apiKey, error: dbError } = await db.rpc('get_secret_key', { secret_name: 'GROQ_API_KEY' });
        
        if (dbError) throw new Error(`Database Error: ${dbError.message}`);
        if (!apiKey) throw new Error("Key not found in database.");

        outputBox.innerText += `✓ Key found: ${apiKey.substring(0, 8)}...\n\nStep 2: Sending request to Groq API...\n`;

        // STEP 2: Send Request to Groq using universal model ID
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${apiKey}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "llama3-8b-8192", // Bulletproof universal model ID
            messages: [{ role: "user", content: prompt }]
          })
        });

        if (!response.ok) {
          const errText = await response.text();
          throw new Error(`Groq API Error (${response.status}):\n${errText}`);
        }

        const data = await response.json();
        
        // STEP 3: Show Success
        outputBox.style.color = "#4ade80";
        outputBox.innerText += `\n✓ SUCCESS! AI Reply:\n\n${data.choices[0].message.content}`;

      } catch (error) {
        outputBox.style.color = "#ef4444";
        outputBox.innerText += `\n❌ FAILED:\n${error.message}`;
      } finally {
        btn.innerText = "Test Connection";
        btn.disabled = false;
      }
    }
  </script>

</body>
</html>
